# On every push to main: build and test the app, publish the single-file build as GitHub Release
# v<version> (version from frontend/package.json, notes from CHANGELOG.md), then ask Cloudflare Pages to redeploy the website, whose build step (scripts/build.sh) downloads
#   https://github.com/a1gemmel/drag-racing-calculator/releases/latest/download/index.html
#
# Secrets: CLOUDFLARE_DEPLOY_HOOK (optional) - the website's Cloudflare Pages deploy hook URL.
# Without it, the release is still published and the site picks it up on its next deploy.
# Every commit must bump the version: the run fails if release v<version> already exists.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create releases in this repo with the built-in GITHUB_TOKEN

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node frontend/scripts/version.mjs version)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::v$version is already released. Bump frontend/package.json and add a CHANGELOG.md section (see AGENTS.md)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node frontend/scripts/version.mjs notes > release-notes.md
          gh release create "v$VERSION" frontend/dist/index.html \
            --target "$GITHUB_SHA" \
            --title "$(node frontend/scripts/version.mjs title)" \
            --notes-file release-notes.md \
            --latest

      - name: Trigger website deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK is not set; skipping website deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Website deploy triggered."
